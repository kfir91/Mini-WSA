spring:
  cloud:
    vault:
      enabled: false
  datasource:
    url: jdbc:h2:mem:wsa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration/analytics
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

wsa:
  enrichment:
    repeat-offender-window: 10m
  rate-limit:
    requests-per-minute: 10000
  kafka:
    topic-raw: security-events.raw
    topic-dlq: security-events.dlq
    retry-interval-ms: 100
    retry-attempts: 1
    dlq-publish-timeout-seconds: 2
