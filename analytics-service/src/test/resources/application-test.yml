spring:
  datasource:
    url: jdbc:h2:mem:miniwsa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

miniwsa:
  enrichment:
    repeat-offender-window: 10m
  kafka:
    topic-raw: security-events.raw
    topic-dlq: security-events.dlq
    retry-interval-ms: 100
    retry-attempts: 1
