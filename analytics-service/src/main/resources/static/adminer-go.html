<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WSA — Adminer connect</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1419;
      color: #9aa8bc;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    code { color: #e7ecf3; }
    .err { color: #f07178; max-width: 28rem; line-height: 1.45; }
  </style>
</head>
<body>
  <p id="status">Loading Adminer settings from config…</p>
  <script>
    (async function () {
      const status = document.getElementById('status');
      try {
        const res = await fetch('/adminer-go/config', { cache: 'no-store' });
        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }
        const cfg = await res.json();
        const url = cfg.url || 'http://localhost:8082/';
        status.innerHTML = 'Opening Adminer → <code>' +
          escapeHtml(cfg.username) + '</code>@<code>' +
          escapeHtml(cfg.server) + '</code>/<code>' +
          escapeHtml(cfg.database) + '</code>…' +
          '<br><small>Password comes from Vault via Compose autologin (not this page).</small>';
        // PHP autologin plugin inside the Adminer container supplies credentials.
        window.location.href = url;
      } catch (e) {
        status.className = 'err';
        status.textContent =
          'Could not load /adminer-go/config (' + (e && e.message ? e.message : e) + '). ' +
          'Open /adminer-go.html from the analytics-service origin (see ADMINER_URL / WSA_ANALYTICS_PORT in .env).';
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
    })();
  </script>
</body>
</html>
