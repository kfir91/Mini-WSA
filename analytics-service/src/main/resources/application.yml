server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: analytics-service
  config:
    import: "optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:true}
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
        # Exact KV path secret/data/wsa/local (do not use spring.application.name as Vault context).
        application-name: wsa/local
        default-context: wsa/local
      config:
        lifecycle:
          enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wsa}
    username: ${SPRING_DATASOURCE_USERNAME:wsa}
    # Password: Vault KV key spring.datasource.password (see scripts/vault-seed.*).
    # Tests disable Vault and set an empty password via application-test.yml / @SpringBootTest.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Separate locations from ingest (same DB; shared classpath in e2e IT).
    locations: classpath:db/migration/analytics
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:wsa-analytics}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.wsa.contracts
        spring.json.value.default.type: com.wsa.contracts.SecurityEventMessage
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

wsa:
  kafka:
    topic-raw: ${KAFKA_TOPIC_RAW:security-events.raw}
    topic-dlq: ${KAFKA_TOPIC_DLQ:security-events.dlq}
    retry-interval-ms: ${KAFKA_RETRY_INTERVAL_MS:500}
    retry-attempts: ${KAFKA_RETRY_ATTEMPTS:3}
    dlq-publish-timeout-seconds: ${KAFKA_DLQ_PUBLISH_TIMEOUT_SECONDS:10}
  enrichment:
    repeat-offender-window: ${REPEAT_OFFENDER_WINDOW:10m}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:100}
  adminer:
    # Browser URL for Adminer (host port). Autologin uses Compose-injected secrets (not this API).
    url: ${ADMINER_URL:http://localhost:8082/}
    # Hostname Adminer uses inside Docker/SSH (Compose service/container DNS).
    # Required when JVM JDBC host is 127.0.0.1 via a published port / tunnel.
    server: ${ADMINER_DEFAULT_SERVER:wsa-postgres}
    # Empty → database name parsed from spring.datasource.url
    database: ${ADMINER_DB:}

springdoc:
  # api-docs must stay enabled or swagger-ui itself returns 404 (springdoc 2.x).
  # The UI loads our YAML via swagger-ui.url — not the scanned annotation docs.
  api-docs:
    enabled: true
  swagger-ui:
    # springdoc uses this as a redirect entry; UI assets live under /swagger-ui/
    path: /swagger-ui.html
    url: /open-api/analytics-api.yaml
    disable-swagger-default-url: true



management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
