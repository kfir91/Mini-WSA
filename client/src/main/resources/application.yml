server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: client
  # Client is React SPA + proxy only — no Vault / DB / Kafka.
  cloud:
    vault:
      enabled: false

wsa:
  client:
    analytics-base-url: ${WSA_ANALYTICS_BASE_URL:http://localhost:8080}
    ingest-base-url: ${WSA_INGEST_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
