# Pipeline IT harness knobs (not Spring app config).
e2e.config-id=14227
e2e.poll-timeout-seconds=60
e2e.poll-interval-seconds=1
e2e.backlog.event-count=25
e2e.client.seed-count=5
e2e.dlq.retry-attempts=0
e2e.outbox.max-attempts=2
e2e.postgres-image=postgres:16-alpine
e2e.kafka-image=confluentinc/cp-kafka:7.6.1
e2e.topic-raw=security-events.raw
e2e.topic-dlq=security-events.dlq
