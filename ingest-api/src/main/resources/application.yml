server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ingest-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wsa}
    username: ${SPRING_DATASOURCE_USERNAME:wsa}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Separate history from analytics-service migrations on the same database.
    table: ingest_flyway_schema_history
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all

wsa:
  kafka:
    topic-raw: ${KAFKA_TOPIC_RAW:security-events.raw}
    publish-timeout-seconds: ${KAFKA_PUBLISH_TIMEOUT_SECONDS:10}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /open-api/ingest-api.yaml
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    kafka:
      enabled: true
