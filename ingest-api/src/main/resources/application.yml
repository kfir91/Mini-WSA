server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ingest-api
  config:
    import: "optional:vault://"
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:true}
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
        # Exact KV path secret/data/wsa/local (do not use spring.application.name as Vault context).
        application-name: wsa/local
        default-context: wsa/local
      config:
        lifecycle:
          enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wsa}
    username: ${SPRING_DATASOURCE_USERNAME:wsa}
    # Password: Vault KV key spring.datasource.password (see scripts/vault-seed.*).
    # Tests disable Vault and set an empty password via application-test.yml / @SpringBootTest.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Separate history + locations from analytics (same DB; shared classpath in e2e IT).
    table: ingest_flyway_schema_history
    locations: classpath:db/migration/ingest
    # Shared DB: analytics may create public objects first; allow ingest history bootstrap.
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all

wsa:
  kafka:
    topic-raw: ${KAFKA_TOPIC_RAW:security-events.raw}
    publish-timeout-seconds: ${KAFKA_PUBLISH_TIMEOUT_SECONDS:10}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /open-api/ingest-api.yaml
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    kafka:
      enabled: true
