<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Default hub port 8084. Non-default: set WSA_CLIENT_PORT in .env and use the URL printed by bootstrap. -->
  <meta http-equiv="refresh" content="0; url=http://localhost:8084/">
  <title>WSA — open client</title>
  <script>
    location.replace('http://localhost:8084/');
  </script>
</head>
<body>
  <p>
    The browser UI lives on the <strong>client</strong> service.
    Open <a href="http://localhost:8084/">http://localhost:8084/</a>
    (hub) or <a href="http://localhost:8084/stats">/stats</a>.
    For a non-default port, see <code>WSA_CLIENT_PORT</code> in <code>.env</code> / bootstrap output.
  </p>
</body>
</html>
